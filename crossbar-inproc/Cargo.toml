[package]
name = "crossbar-inproc"
version = "0.1.0"
edition = "2021"
description = "In-process URI router with handler dispatch."
license = "MIT OR Apache-2.0"
keywords = ["router", "dispatch", "handler", "uri"]
categories = ["network-programming"]

[dependencies]
crossbar-macros = { path = "../crossbar-macros" }

[dev-dependencies]
criterion = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[example]]
name = "demo"

[[bench]]
name = "dispatch"
harness = false
