[package]
name = "crossbar-inproc"
version = "0.2.0"
edition = "2021"
description = "Ultra-fast in-process pub/sub bus with type-safe topics."
license = "MIT OR Apache-2.0"
keywords = ["pubsub", "bus", "inproc", "streaming", "zero-copy"]
categories = ["concurrency"]

[dependencies]
arc-swap = "1"

[dev-dependencies]
criterion = "0.8.2"

[[example]]
name = "demo"

[[bench]]
name = "bus"
harness = false
